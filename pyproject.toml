[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rdv"
version = "0.1.0"
description = "Performative labels in variant effect prediction: ClinVar label history, circularity-aware benchmarks"
requires-python = ">=3.10"
dependencies = ["polars>=1.0", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
